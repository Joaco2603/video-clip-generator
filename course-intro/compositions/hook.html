<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Marker Felt";
          src: url("assets/fonts/MarkerFelt.ttc") format("truetype");
          font-weight: 400;
          font-style: normal;
        }
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #fffcf2;
          color: #252422;
        }
        .kicker {
          position: absolute;
          top: 88px;
          left: 120px;
          margin: 0;
          font-family: "IBM Plex Mono", monospace;
          font-size: 22px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
        }
        .headline {
          position: absolute;
          top: 220px;
          left: 120px;
          margin: 0;
          font-family: "Marker Felt", cursive;
          font-weight: 400;
          font-size: 92px;
          line-height: 1.05;
        }
        .bar {
          position: absolute;
          top: 340px;
          left: 120px;
          width: 520px;
          height: 6px;
          background: #eb5e28;
        }
        .flow {
          position: absolute;
          left: 120px;
          right: 120px;
          top: 520px;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .node {
          border: 3px solid #252422;
          border-radius: 4px;
          padding: 22px 36px;
          font-family: "Marker Felt", cursive;
          font-size: 48px;
          background: #fffcf2;
        }
        #hook-n3 {
          border-color: #eb5e28;
        }
        .shaft {
          display: block;
          width: 140px;
          height: 4px;
          background: #eb5e28;
        }
      </style>
      <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
        <p class="kicker" id="hook-kicker">the hook</p>
        <h1 class="headline" id="hook-title">Lost under the math?</h1>
        <div class="bar" id="hook-bar"></div>
        <div class="flow">
          <div class="node" id="hook-n1">the</div>
          <span class="shaft" id="hook-a1"></span>
          <div class="node" id="hook-n2">cat</div>
          <span class="shaft" id="hook-a2"></span>
          <div class="node" id="hook-n3">block</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#hook-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.15);
        tl.fromTo("#hook-bar", { scaleX: 0 }, { scaleX: 1, transformOrigin: "left center", duration: 0.35, ease: "power2.out" }, 0.4);
        tl.fromTo("#hook-n1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.7);
        tl.fromTo("#hook-a1", { scaleX: 0 }, { scaleX: 1, transformOrigin: "left center", duration: 0.3, ease: "power2.out" }, 1.0);
        tl.fromTo("#hook-n2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.25);
        tl.fromTo("#hook-a2", { scaleX: 0 }, { scaleX: 1, transformOrigin: "left center", duration: 0.3, ease: "power2.out" }, 1.55);
        tl.fromTo("#hook-n3", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.85);
        window.__timelines["hook"] = tl;
      </script>
    </template>
  </body>
</html>
