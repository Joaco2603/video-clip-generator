<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Marker Felt";
          src: url("assets/fonts/MarkerFelt.ttc") format("truetype");
          font-weight: 400;
          font-style: normal;
        }
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #fffcf2;
          color: #252422;
        }
        .kicker {
          position: absolute;
          top: 88px;
          left: 120px;
          margin: 0;
          font-family: "IBM Plex Mono", monospace;
          font-size: 22px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
        }
        .headline {
          position: absolute;
          top: 200px;
          left: 120px;
          margin: 0;
          font-family: "Marker Felt", cursive;
          font-weight: 400;
          font-size: 72px;
          line-height: 1.05;
        }
        .flow {
          position: absolute;
          left: 140px;
          right: 140px;
          top: 480px;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .node {
          border: 3px solid #252422;
          border-radius: 4px;
          min-width: 220px;
          padding: 28px 24px;
          text-align: center;
          font-family: "Marker Felt", cursive;
          font-size: 44px;
          background: #fffcf2;
        }
        #diagram-n2 {
          border-color: #eb5e28;
        }
        .shaft {
          display: block;
          width: 120px;
          height: 4px;
          background: #eb5e28;
        }
      </style>
      <div id="root" data-composition-id="diagram" data-width="1920" data-height="1080">
        <p class="kicker">the promise</p>
        <h1 class="headline" id="diagram-title">Tokens → Attention → Output</h1>
        <div class="flow">
          <div class="node" id="diagram-n1">Tokens</div>
          <span class="shaft" id="diagram-a1"></span>
          <div class="node" id="diagram-n2">Attention</div>
          <span class="shaft" id="diagram-a2"></span>
          <div class="node" id="diagram-n3">Output</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#diagram-title", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.2);
        tl.fromTo("#diagram-n1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.8);
        tl.fromTo("#diagram-a1", { scaleX: 0 }, { scaleX: 1, transformOrigin: "left center", duration: 0.35, ease: "power2.out" }, 1.2);
        tl.fromTo("#diagram-n2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.6);
        tl.fromTo("#diagram-a2", { scaleX: 0 }, { scaleX: 1, transformOrigin: "left center", duration: 0.35, ease: "power2.out" }, 2.05);
        tl.fromTo("#diagram-n3", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 2.45);
        window.__timelines["diagram"] = tl;
      </script>
    </template>
  </body>
</html>
